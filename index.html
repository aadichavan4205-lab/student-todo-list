
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student To-Do List</title>
    <link rel="stylesheet" href="style.css">
    <script src="js/add-task.js" defer></script>
    <script src="js/task-actions.js" defer></script>
</head>
<body>
    <main class="todo-container">
        <header class="page-header">
            <h1>Student To-Do List</h1>
            <p>Plan your studies. Complete your goals.</p>
        </header>

        <section class="task-section">
            <h2>My Study Tasks</h2>

            <div class="task-input">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="Enter your study task..."
                    aria-label="New study task"
                >
                <button id="addTaskBtn">Add Task</button>
            </div>

            <p id="taskMessage" role="status"></p>
            <ul id="taskList" aria-label="Study tasks"></ul>
        </section>

        <footer>
            <p>Student To-Do List | Git Group Project</p>
            <p>Aadinath · Akash · Mayuresh · Anirudh</p>
        </footer>
    </main>
</body>
</html>
